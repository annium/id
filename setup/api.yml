version: "3.6"
services:
  api:
    build:
      context: ../server/src
      dockerfile: Annium.Id/Dockerfile
    image: id_api
    container_name: id_api
    restart: always
    ports:
      - "9501:5000"
    volumes:
      - "../run/configuration:/app/configuration"
      - "../run/data:/app/data"
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
networks:
  default:
    external:
      name: id_net
